[project]
name = "openarm-gripette-simu"
version = "0.1.0"
description = "MuJoCo simulation of the OpenArm right arm + Gripette gripper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.6",
    "numpy",
    "opencv-python>=4.9",
    # server.py imports grpc directly. The generated stubs (and the floor they
    # need) now live in gripette-core, which carries that constraint itself.
    "grpcio>=1.81",
    "openarm-gripette-model",
    # [kinematics] pulls placo: this package uses Kinematics, not just the
    # proto contract. placo and protobuf are no longer listed directly — the
    # only importer of either moved into gripette-core.
    "gripette-core[kinematics]",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.60"]
dataset = ["lerobot[dataset]==0.6.0 ; python_version >= '3.12'"]
# Policy evaluation client (examples/evaluate.py): loads a trained policy and
# drives the sim over gRPC. [diffusion] supplies diffusers; [pi] supplies the
# transformers stack for the Pi0/Pi0.5/Pi0Fast checkpoints this client supports.
# scipy is also used directly for rotation math.
eval = [
    "lerobot[diffusion,pi]==0.6.0 ; python_version >= '3.12'",
    "scipy>=1.10",
    # Chunk-relative checkpoints register a custom ProcessorStep, so lerobot
    # cannot rebuild their pipeline without this import being available. Not
    # optional-within-the-extra: evaluate.py refuses to guess the representation,
    # and a missing import here fails at checkpoint load.
    "grabette-chunkrel",
    # evaluate.py decodes (strategy, closure) gripper actions with the grasp
    # projection, the same one the dataset converter used.
    "grabette-dataset-tools",
]
# tests/ — needs the `eval` extra as well: the GripAssist regression tests load
# examples/evaluate.py, which imports the policy stack.
test = ["pytest>=8"]
# examples/teleop_bridge.py: consumes the grabette teleop WebSocket and forwards
# deltas / gripper goals to the arm + gripper gRPC servers (sim or real).
teleop = [
    "httpx>=0.27",
    "websockets",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Resolved from the monorepo workspace (robots/openarm/openarm_gripette_model),
# not PyPI. Was a local `../` path dep in the standalone repo.
openarm-gripette-model = { workspace = true }
gripette-core = { workspace = true }
grabette-chunkrel = { workspace = true }
grabette-dataset-tools = { workspace = true }

# OpenCV is intentionally headless by default: lerobot depends on
# opencv-python-headless and the on-device services (grabette/Pi) need it, and
# one workspace venv holds a single cv2. `evaluate.py --debug` saves frames to
# disk in this mode; for a live GUI window on a workstation, see the README
# ("Evaluate a trained policy" → OpenCV opt-in). NOTE: a member-level [tool.uv]
# override-dependencies is a no-op — uv honors it only at the workspace root —
# so the previous override here (which never took effect) was removed.
