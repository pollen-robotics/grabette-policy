[project]
name = "rebot-gripette-model"
version = "0.1.0"
description = "reBot B601-RS + Gripette robot model (URDF, MuJoCo XML, mesh assets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Tooling for re-exporting from Onshape and re-running the postprocess.
urdf = [
    "onshape-to-robot>=1.8.1",
    "pybullet>=3.2.7",
    "mujoco>=3.6",
]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Data files (URDF, XML, STL, JSON) are the entire point of this package.
# NOTE: no "*.part" here, unlike openarm_gripette_model. The Onshape export
# emits a .part sidecar per mesh; nothing in the URDF or MJCF references them
# and they are ~50 kB of noise, so they are not vendored.
packages = ["rebot_gripette_model"]
artifacts = ["*.stl", "*.urdf", "*.xml", "*.json"]
