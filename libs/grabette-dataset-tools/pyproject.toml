[project]
name = "grabette-dataset-tools"
version = "0.1.0"
description = "Training-side transforms for GRABETTE LeRobot datasets: grasp projection, chunk-relative stats, raw-capture normalization, publish gate"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "click",
    "pandas",
    # Imported directly (dataset parquet + Hub I/O); also pulled in by lerobot,
    # but declared so the package works without it (Python 3.11 CI lane).
    "pyarrow",
    "huggingface-hub",
    "lerobot[dataset]==0.6.0 ; python_version >= '3.12'",
    # The grasp projection reads the gripper's joint limits from gripette's
    # config, so the dataset converter and the eval loop cannot disagree about
    # what a full close means. Base gripette is pure wheels — the hardware deps
    # (rustypot, picamera2) are in its `rpi` extra and are not pulled here.
    "gripette",
    "grabette-chunkrel",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# gripette: git source pinned in the workspace root pyproject.
grabette-chunkrel = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
