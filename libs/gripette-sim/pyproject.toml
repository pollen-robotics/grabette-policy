[project]
name = "gripette-sim"
version = "0.1.0"
description = "Shared MuJoCo simulation pieces for Gripette-equipped arms"
readme = "README.md"
requires-python = ">=3.11"
# This is the half of the stack gripette-core deliberately refuses to carry.
# gripette-core is imported by the real-hardware drivers, which run on machines
# with no simulator, so its pyproject says in as many words: no mujoco, no
# opencv. The Gripette's camera model, its gripper service and the MuJoCo
# wrapper all need both - and they are identical for every arm wearing the same
# gripper, so they belong in one place that is not gripette-core.
dependencies = [
    "gripette-core",
    "numpy",
    "mujoco>=3.0",
    "opencv-python-headless",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.uv.sources]
gripette-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gripette_sim"]
